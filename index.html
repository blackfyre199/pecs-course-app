function localDateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtDate(s){const d=parseLocalDate(s);return `${d.getMonth()+1}月${d.getDate()}日 ${CN_DAYS[d.getDay()]}`}
function isoWeekMonday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function typeBadge(t){const cls=t==='Practical'?'practical':t==='Optional'?'optional':'';const label=t==='Practical'?'实践':t==='Optional'?'选修':'课程';return `<span class="badge ${cls}">${label}</span>`}
const DONE_KEY='pecs_cls_completed_v1';
function eventId(e){const raw=[e.date,e.start,e.end,e.title,e.room].join('|');let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return 'e'+(h>>>0).toString(36)}
function getDoneSet(){try{return new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]'))}catch{return new Set()}}
function isDone(e){return getDoneSet().has(eventId(e))}
function toggleDone(id){const done=getDoneSet();done.has(id)?done.delete(id):done.add(id);localStorage.setItem(DONE_KEY,JSON.stringify([...done]));const active=document.querySelector('.tab.active')?.dataset.view||'today';setView(active);updateHero()}
function eventCard(e){const id=eventId(e);const done=isDone(e);return `<div class="card event ${done?'done':''}"><div class="time">${e.start}<small>${e.end}</small></div><div class="event-main"><div class="title">${TITLE_CN[e.title]||e.title}</div><div class="meta">${typeBadge(e.type)}${e.title}<br>📍 ${e.room} · 👤 ${e.teacher}</div><div class="complete-row"><button class="complete-btn ${done?'checked':''}" onclick="toggleDone('${id}')">${done?'✓ 已完成':'○ 标记已完成'}</button></div></div></div>`}
function todayEvents(){return SCHEDULE.filter(e=>e.date===localDateKey(new Date())).sort((a,b)=>a.start.localeCompare(b.start))}
function renderToday(){const key=localDateKey(new Date());const ev=todayEvents();content.innerHTML=`<div class="section-title"><h2>今天的课程</h2><span>${fmtDate(key)}</span></div>`+(ev.length?ev.map(eventCard).join(''):`<div class="card empty">今天没有课程 🎉</div>`)+`<div class="notice">已按你的个人设置过滤：Group 2；两个选修课都保留；Stipendium – Hungarian for foreigners I. 不显示。</div>`}
function renderWeek(){const now=new Date();const mon=isoWeekMonday(now);let html=`<div class="section-title"><h2>本周</h2><span>${fmtDate(localDateKey(mon))} 起</span></div>`;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const key=localDateKey(d);const ev=SCHEDULE.filter(e=>e.date===key).sort((a,b)=>a.start.localeCompare(b.start));if(i<5||ev.length){html+=`<div class="weekday">${CN_DAYS[d.getDay()]} <span class="dayline">${d.getMonth()+1}/${d.getDate()}</span></div>`;html+=ev.length?ev.map(eventCard).join(''):`<div class="card empty" style="padding:18px">无课程</div>`}}content.innerHTML=html}
function renderSemester(){const groups={};SCHEDULE.forEach(e=>{const mon=localDateKey(isoWeekMonday(parseLocalDate(e.date)));(groups[mon]??=[]).push(e)});let html=`<div class="section-title"><h2>整学期</h2><span>${SCHEDULE.length} 个课时记录</span></div>`;Object.keys(groups).sort().forEach((mon,idx)=>{html+=`<div class="semester-week">${fmtDate(mon)} 起的一周</div>`;const byDate={};groups[mon].forEach(e=>(byDate[e.date]??=[]).push(e));Object.keys(byDate).sort().forEach(date=>{html+=`<div class="weekday">${fmtDate(date)}</div>`+byDate[date].sort((a,b)=>a.start.localeCompare(b.start)).map(eventCard).join('')})});html+=`<div class="semester-week">第 9 周 · 10月26日–30日</div><div class="card empty" style="padding:20px">Autumn Holiday · 秋假</div>`;content.innerHTML=html}
function renderCourses(){const map={};SCHEDULE.forEach(e=>{if(!map[e.title])map[e.title]=[];map[e.title].push(e)});let html=`<div class="section-title"><h2>课程详情</h2><span>${Object.keys(map).length} 门课程/模块</span></div><div class="course-grid">`;Object.keys(map).sort().forEach(t=>{const arr=map[t];html+=`<div class="card course-card" onclick='renderCourseDetail(${JSON.stringify(t)})'><h3>${TITLE_CN[t]||t}</h3><div class="count">${t}<br>${arr.length} 个课时 · ${[...new Set(arr.map(x=>x.room).filter(x=>x!=='—'))].join(' / ')||'教室待定'}</div></div>`});content.innerHTML=html+'</div>'}
function renderCourseDetail(title){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));const arr=SCHEDULE.filter(e=>e.title===title).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const teachers=[...new Set(arr.map(x=>x.teacher).filter(x=>x!=='—'))];const rooms=[...new Set(arr.map(x=>x.room).filter(x=>x!=='—'))];content.innerHTML=`<div class="detail-head"><button class="back" onclick="setView('courses')">← 返回</button><div class="detail-title"><h2>${TITLE_CN[title]||title}</h2><p>${title}</p></div></div><div class="card" style="margin-top:14px"><div class="kv"><div class="k">教师</div><div>${teachers.join(' / ')||'—'}</div></div><div class="kv"><div class="k">教室</div><div>${rooms.join(' / ')||'—'}</div></div><div class="kv"><div class="k">课时数</div><div>${arr.length}</div></div></div><div class="section-title"><h2>全部安排</h2><span>${arr.length} 条</span></div>`+arr.map(e=>`<div class="weekday">${fmtDate(e.date)}</div>${eventCard(e)}`).join('')}
function setView(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));({today:renderToday,week:renderWeek,semester:renderSemester,courses:renderCourses}[v])()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function updateHero(){const now=new Date();const key=localDateKey(now);heroDate.textContent=`${now.getMonth()+1}月${now.getDate()}日 · ${CN_DAYS[now.getDay()]}`;const ev=todayEvents();const doneCount=ev.filter(isDone).length;heroSummary.textContent=ev.length?`今天 ${ev.length} 节课 · 已完成 ${doneCount} 节`:'今天没有课程';const nowMin=now.getHours()*60+now.getMinutes();const upcoming=ev.find(e=>!isDone(e)&&(()=>{const [h,m]=e.start.split(':').map(Number);return h*60+m>=nowMin})());nextClass.innerHTML=upcoming?`下一节 <b>${upcoming.start}</b> · ${TITLE_CN[upcoming.title]||upcoming.title} · ${upcoming.room}`:(ev.length?(doneCount===ev.length?'今天的课程已全部完成 ✓':'今天没有未完成的后续课程'):'可以休息一下，查看「本周」安排。')}
